<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | DevMate</title>
    <link rel="stylesheet"
          href="../../static/css/auth.css"
          th:href="@{/css/auth.css}">
</head>
<body>
<main class="signup-page">
    <h1>회원가입</h1>
    <p>DevMate에 오신 것을 환영합니다.</p>

    <form class="signup-form" method="post" th:action="@{/auth/signup}">

        <fieldset>
            <legend>계정 정보</legend>

            <div class="form-field">
                <label for="email">이메일</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-field">
                <label for="password">비밀번호</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="영문, 숫자, 특수문자 포함 8자~20자"
                    required
                    aria-describedby="passwordHelp"
                >
            </div>

            <div class="form-field">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input
                    type="password"
                    id="passwordConfirm"
                    name="passwordConfirm"
                    placeholder="비밀번호를 다시 입력하세요"
                    required
                    aria-describedby="passwordConfirmMessage"
                >
                <p id="passwordConfirmMessage" aria-live="polite"></p>
            </div>
        </fieldset>

        <fieldset>
            <legend>기본 정보</legend>

            <div class="form-field">
                <label for="name">닉네임</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="50자 이하"
                    required
                    aria-describedby="nameHelp"
                >
                <p id="nameHelp">다른 사용자에게 표시되는 이름입니다.</p>
            </div>
        </fieldset>

        <button type="submit">가입하기</button>

        <p class="login-link">
            이미 계정이 있으신가요?
            <a href="/auth/login" th:href="@{/auth/login}">로그인</a>
        </p>

    </form>
</main>
<script src="../../static/js/auth.js"
        th:src="@{/js/auth.js}"></script>
</body>
</html>

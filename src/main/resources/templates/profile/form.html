<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet"
          href="../../static/css/profile.css"
          th:href="@{/css/profile.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필 | DevMatch</title>
</head>
<body>
<main class="profile-page">
    <h1>내 프로필</h1>
    <p>기술 스택과 활동 가능한 시간을 알려주세요.</p>

    <form class="profile-form">
        <fieldset>
            <legend>역할 및 기술</legend>

            <div class="form-field">
                <label for="role">희망 역할</label>
                <select id="role" name="role" required>
                    <option value="">역할을 선택하세요</option>
                    <option value="FRONTEND">프론트엔드</option>
                    <option value="BACKEND">백엔드</option>
                    <option value="ANDROID">Android</option>
                    <option value="IOS">iOS</option>
                    <option value="AI">AI</option>
                </select>
            </div>

            <fieldset class="skill-options">
                <legend>보유 기술 스택 — 여러 개 선택 가능</legend>

                <label>
                    <input type="checkbox" name="skills" value="JAVA">
                    Java
                </label>
                <label>
                    <input type="checkbox" name="skills" value="KOTLIN">
                    Kotlin
                </label>
                <label>
                    <input type="checkbox" name="skills" value="PYTHON">
                    Python
                </label>
                <label>
                    <input type="checkbox" name="skills" value="JAVASCRIPT">
                    JavaScript
                </label>
                <label>
                    <input type="checkbox" name="skills" value="SPRING_BOOT">
                    Spring Boot
                </label>
                <label>
                    <input type="checkbox" name="skills" value="REACT">
                    React
                </label>
            </fieldset>
        </fieldset>

        <fieldset>
            <legend>활동 시간</legend>

            <div class="form-field">
                <label for="weeklyHours">주당 투자 가능 시간</label>
                <input
                        type="number"
                        id="weeklyHours"
                        name="weeklyHours"
                        min="1"
                        max="168"
                        step="1"
                        placeholder="예: 6"
                        required
                        aria-describedby="weeklyHoursHelp"
                >
                <p id="weeklyHoursHelp">
                    일주일 동안 실제로 참여할 수 있는 시간을 입력하세요.
                </p>
            </div>

            <div class="form-field">
                <p id="availabilityTitle">활동 가능 시간대</p>
                <p id="availabilityHelp">
                    한국 시간 기준으로 참여 가능한 시간을 선택하세요.
                    각 칸은 1시간입니다.
                </p>

                <div class="time-table-wrapper"
                     role="region"
                     aria-labelledby="availabilityTitle"
                     tabindex="0">
                    <table class="time-table"
                           aria-labelledby="availabilityTitle"
                           aria-describedby="availabilityHelp">
                        <thead>
                        <tr>
                            <th scope="col">시간</th>
                            <th scope="col">월</th>
                            <th scope="col">화</th>
                            <th scope="col">수</th>
                            <th scope="col">목</th>
                            <th scope="col">금</th>
                            <th scope="col">토</th>
                            <th scope="col">일</th>
                        </tr>
                        </thead>

                        <tbody id="timeTableBody"></tbody>
                    </table>
                </div>

                <p id="selectedTimeCount" aria-live="polite">
                    선택한 시간: 주 0시간
                </p>
            </div>
        </fieldset>

        <fieldset>
            <legend>프로젝트 목표 및 지역</legend>

            <div class="form-field">
                <label for="goal">희망 목표</label>
                <select id="goal" name="goal" required>
                    <option value="">목표를 선택하세요</option>
                    <option value="CONTEST">대회 출전</option>
                    <option value="PORTFOLIO">포트폴리오</option>
                    <option value="SERVICE">실제 서비스 운영</option>
                </select>
            </div>

            <div class="form-field">
                <label for="region">대면 가능 지역 — 대면 지원 시 필요</label>
                <input
                        type="text"
                        id="region"
                        name="region"
                        placeholder="예: 서울특별시 용산구"
                        aria-describedby="regionHelp"
                >
                <p id="regionHelp">
                    현재는 화면 시안이며, 추후 지역 선택 방식으로 변경합니다.
                </p>
            </div>
        </fieldset>

        <fieldset>
            <legend>추가 소개</legend>

            <div class="form-field">
                <label for="portfolioUrl">포트폴리오 링크 — 선택</label>
                <input
                        type="url"
                        id="portfolioUrl"
                        name="portfolioUrl"
                        placeholder="https://github.com/사용자명"
                >
            </div>

            <div class="form-field">
                <label for="introduction">자기소개 — 선택</label>
                <textarea
                        id="introduction"
                        name="introduction"
                        rows="5"
                        placeholder="프로젝트 경험이나 관심 분야를 소개해주세요."
                ></textarea>
            </div>
        </fieldset>

        <button type="button" disabled>
            프로필 저장 — 준비 중
        </button>
    </form>
</main>
<script src="../../static/js/time-selector.js"
        th:src="@{/js/time-selector.js}"></script>
</body>
</html>
